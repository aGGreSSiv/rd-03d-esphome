esphome:
  name: rd-03d-sensor-test
  friendly_name: RD-03D Sensor Test
  on_boot:
    priority: -100
    then:
      # Single target detection mode komutu gönder
      - uart.write:
          id: uart_rd03d
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0x80, 0x00, 0x04, 0x03, 0x02, 0x01]
      - delay: 200ms
      - logger.log: 
          format: "RD-03D initialized - Single Target Detection Mode activated"
          level: INFO

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino  # ESP-IDF yerine Arduino - daha kolay UART kullanımı için

# Enable logging
logger:
  level: DEBUG
  baud_rate: 0  # UART kullandığımız için USB logger'ı devre dışı bırak

# Enable Home Assistant API
api:
  encryption:
    key: "Nqcibr4vt4DDkcugFdC8eJVf7XTLbba7GVQsKWZzooE="

ota:
  - platform: esphome
    password: "8a086dec211ee67b0ab080c26c3b6796"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Rd-03D-Sensor-Test"
    password: "vL6oI5g9csXi"

captive_portal:

# UART Configuration for RD-03D
# ESP32-S3: GPIO16 ve GPIO17 güvenli pinlerdir
uart:
  id: uart_rd03d
  tx_pin: GPIO17  # ESP32-S3 → RD-03D RXD
  rx_pin: GPIO16  # ESP32-S3 ← RD-03D TXD
  baud_rate: 256000
  rx_buffer_size: 256
  # debug:
  #   direction: BOTH  # Debug için açabilirsiniz
  #   dummy_receiver: false

# Sensörler
sensor:
  # Mesafe sensörü (cm cinsinden)
  - platform: template
    name: "Distance"
    id: rd03d_distance
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    icon: "mdi:ruler"
    device_class: "distance"
    state_class: "measurement"
    
  # X koordinatı (mm cinsinden)
  - platform: template
    name: "X Position"
    id: rd03d_x
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    icon: "mdi:axis-x-arrow"
    state_class: "measurement"
    
  # Y koordinatı (mm cinsinden)
  - platform: template
    name: "Y Position"
    id: rd03d_y
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    icon: "mdi:axis-y-arrow"
    state_class: "measurement"
    
  # Açı (derece cinsinden)
  - platform: template
    name: "Angle"
    id: rd03d_angle
    unit_of_measurement: "°"
    accuracy_decimals: 1
    icon: "mdi:angle-acute"
    state_class: "measurement"

  # Hız (cm/s cinsinden)
  - platform: template
    name: "Speed"
    id: rd03d_speed
    unit_of_measurement: "cm/s"
    accuracy_decimals: 0
    icon: "mdi:speedometer"
    state_class: "measurement"
    
  # Distance Resolution
  - platform: template
    name: "Distance Resolution"
    id: rd03d_distance_res
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    icon: "mdi:ruler-square"
    state_class: "measurement"

  # WiFi sinyal gücü
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  # Uptime
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# Binary sensörler
binary_sensor:
  # Hedef algılama durumu
  - platform: template
    name: "Target Detected"
    id: rd03d_target_detected
    device_class: "occupancy"

# Text sensörler
text_sensor:
  # Durum bilgisi
  - platform: template
    name: "Status"
    id: rd03d_status
    icon: "mdi:information-outline"
  
  # ESPHome versiyonu
  - platform: version
    name: "ESPHome Version"
    
  # WiFi bilgisi
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

# Ana döngü - UART'tan veri okuma ve parse etme
interval:
  - interval: 50ms
    then:
      - lambda: |-
          // Static değişkenler - fonksiyon çağrıları arasında korunur
          static uint8_t rx_buffer[64] = {0};
          static uint8_t rx_count = 0;
          static uint32_t last_valid_data = 0;
          static uint32_t frame_count = 0;
          static uint32_t error_count = 0;
          
          // UART'tan mevcut tüm verileri oku
          while (id(uart_rd03d).available()) {
            uint8_t byte;
            id(uart_rd03d).read_byte(&byte);
            
            // Buffer'a ekle
            rx_buffer[rx_count++] = byte;
            
            // Buffer overflow kontrolü
            if (rx_count >= 64) {
              ESP_LOGW("RD03D", "Buffer overflow! Resetting...");
              rx_count = 0;
              memset(rx_buffer, 0, 64);
              error_count++;
              continue;
            }
            
            // Frame sonu kontrolü: 0x55 0xCC
            if (rx_count >= 2 && 
                rx_buffer[rx_count - 2] == 0x55 && 
                rx_buffer[rx_count - 1] == 0xCC) {
              
              frame_count++;
              
              // Frame uzunluğu kontrolü (minimum 32 byte olmalı)
              if (rx_count >= 32) {
                
                // Header kontrolü: 0xAA 0xFF 0x03 0x00
                if (rx_buffer[0] == 0xAA && 
                    rx_buffer[1] == 0xFF && 
                    rx_buffer[2] == 0x03 && 
                    rx_buffer[3] == 0x00) {
                  
                  // Target1 verilerini parse et (byte 4-11)
                  // X koordinatı (2 byte, little endian) - offset 0x200
                  int16_t target_x = ((int16_t)(rx_buffer[4] | (rx_buffer[5] << 8))) - 0x200;
                  
                  // Y koordinatı (2 byte, little endian) - offset 0x8000
                  int16_t target_y = ((int16_t)(rx_buffer[6] | (rx_buffer[7] << 8))) - 0x8000;
                  
                  // Speed (2 byte, little endian) - offset 0x10
                  int16_t target_speed = ((int16_t)(rx_buffer[8] | (rx_buffer[9] << 8))) - 0x10;
                  
                  // Distance Resolution (2 byte, little endian)
                  uint16_t target_distance_res = rx_buffer[10] | (rx_buffer[11] << 8);
                  
                  // Mesafe hesapla - Pisagor teoremi (X² + Y²)^0.5
                  // Sonucu 10'a böl çünkü mm'den cm'ye çeviriyoruz
                  float distance = sqrt(pow(target_x, 2) + pow(target_y, 2)) / 10.0;
                  
                  // Açı hesapla - atan2 fonksiyonu radyan döndürür
                  // 180/π ile dereceye çevir
                  float angle = atan2(target_y, target_x) * 180.0 / 3.14159265359;
                  
                  // Hedef algılandı mı kontrolü
                  // Eğer mesafe 0.5 cm'den büyükse hedef var
                  bool target_detected = (distance > 0.5);
                  
                  // Sensörleri güncelle
                  if (target_detected) {
                    id(rd03d_distance).publish_state(distance);
                    id(rd03d_x).publish_state(target_x);
                    id(rd03d_y).publish_state(target_y);
                    id(rd03d_angle).publish_state(angle);
                    id(rd03d_speed).publish_state(target_speed);
                    id(rd03d_distance_res).publish_state(target_distance_res);
                    id(rd03d_target_detected).publish_state(true);
                    id(rd03d_status).publish_state("Target Detected");
                    
                    last_valid_data = millis();
                    
                    // Debug log - her 50 frame'de bir yazdır (log spam önlemek için)
                    if (frame_count % 50 == 0) {
                      ESP_LOGD("RD03D", "Frame: %d, Distance: %.1f cm, Angle: %.1f°, X: %d mm, Y: %d mm, Speed: %d cm/s", 
                               frame_count, distance, angle, target_x, target_y, target_speed);
                    }
                    
                  } else {
                    // Hedef yok
                    id(rd03d_target_detected).publish_state(false);
                    id(rd03d_status).publish_state("No Target");
                    
                    // Sıfır değerleri yayınla
                    id(rd03d_distance).publish_state(0);
                    id(rd03d_x).publish_state(0);
                    id(rd03d_y).publish_state(0);
                    id(rd03d_angle).publish_state(0);
                    id(rd03d_speed).publish_state(0);
                    id(rd03d_distance_res).publish_state(0);
                  }
                  
                } else {
                  // Header yanlış
                  ESP_LOGW("RD03D", "Invalid header: 0x%02X 0x%02X 0x%02X 0x%02X", 
                           rx_buffer[0], rx_buffer[1], rx_buffer[2], rx_buffer[3]);
                  error_count++;
                }
                
              } else {
                // Frame çok kısa
                ESP_LOGW("RD03D", "Frame too short: %d bytes", rx_count);
                error_count++;
              }
              
              // Buffer'ı sıfırla - yeni frame için hazırla
              rx_count = 0;
              memset(rx_buffer, 0, 64);
            }
          }
          
          // Timeout kontrolü - 5 saniye veri gelmezse
          if (millis() - last_valid_data > 5000 && last_valid_data > 0) {
            id(rd03d_target_detected).publish_state(false);
            id(rd03d_status).publish_state("No Data - Check Connections");
            ESP_LOGW("RD03D", "No data for 5 seconds! Frames: %d, Errors: %d", frame_count, error_count);
          }
          
          // Her 10000 frame'de bir istatistik yazdır
          if (frame_count % 10000 == 0 && frame_count > 0) {
            ESP_LOGI("RD03D", "Stats - Total Frames: %d, Errors: %d, Error Rate: %.2f%%", 
                     frame_count, error_count, (error_count * 100.0) / frame_count);
          }

# Diagnostic button - sensörü yeniden başlat
button:
  - platform: restart
    name: "Restart ESP32"
    
  - platform: template
    name: "Reinitialize Sensor"
    on_press:
      - logger.log: "Reinitializing RD-03D sensor..."
      - uart.write:
          id: uart_rd03d
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0x80, 0x00, 0x04, 0x03, 0x02, 0x01]
      - delay: 200ms
      - logger.log: "RD-03D reinitialized"
