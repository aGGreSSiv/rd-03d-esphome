esphome:
  name: rd-03d-sensor-test
  friendly_name: RD-03D Sensor Test
  on_boot:
    priority: -100
    then:
      # Single target detection mode komutu gönder
      - uart.write:
          id: uart_rd03d
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0x80, 0x00, 0x04, 0x03, 0x02, 0x01]
      - delay: 200ms
      - logger.log: 
          format: "RD-03D initialized - Single Target Detection Mode activated"
          level: INFO

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "Nqcibr4vt4DDkcugFdC8eJVf7XTLbba7GVQsKWZzooE="

ota:
  - platform: esphome
    password: "8a086dec211ee67b0ab080c26c3b6796"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Rd-03D-Sensor-Test"
    password: "vL6oI5g9csXi"

captive_portal:

# UART Configuration for RD-03D
uart:
  id: uart_rd03d
  tx_pin: GPIO43  # ESP32-S3 → RD-03D RXD
  rx_pin: GPIO44  # ESP32-S3 ← RD-03D TXD
  baud_rate: 256000
  rx_buffer_size: 256

# Sensörler
sensor:
  - platform: template
    name: "Distance"
    id: rd03d_distance
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    icon: "mdi:ruler"
    device_class: "distance"
    state_class: "measurement"
    
  - platform: template
    name: "X Position"
    id: rd03d_x
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    icon: "mdi:axis-x-arrow"
    state_class: "measurement"
    
  - platform: template
    name: "Y Position"
    id: rd03d_y
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    icon: "mdi:axis-y-arrow"
    state_class: "measurement"
    
  - platform: template
    name: "Angle"
    id: rd03d_angle
    unit_of_measurement: "°"
    accuracy_decimals: 1
    icon: "mdi:angle-acute"
    state_class: "measurement"

  - platform: template
    name: "Speed"
    id: rd03d_speed
    unit_of_measurement: "cm/s"
    accuracy_decimals: 0
    icon: "mdi:speedometer"
    state_class: "measurement"
    
  - platform: template
    name: "Distance Resolution"
    id: rd03d_distance_res
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    icon: "mdi:ruler-square"
    state_class: "measurement"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# Binary sensörler
binary_sensor:
  - platform: template
    name: "Target Detected"
    id: rd03d_target_detected
    device_class: "occupancy"

# Text sensörler
text_sensor:
  - platform: template
    name: "Status"
    id: rd03d_status
    icon: "mdi:information-outline"
  
  - platform: version
    name: "ESPHome Version"
    
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

# Ana döngü - DÜZELTİLMİŞ VERSİYON
interval:
  - interval: 50ms
    then:
      - lambda: |-
          static uint8_t rx_buffer[64] = {0};
          static uint8_t rx_count = 0;
          static uint32_t last_valid_data = 0;
          static uint32_t frame_count = 0;
          static uint32_t error_count = 0;
          
          // UART'tan mevcut tüm verileri oku
          while (id(uart_rd03d).available()) {
            uint8_t byte;
            id(uart_rd03d).read_byte(&byte);
            
            rx_buffer[rx_count++] = byte;
            
            // Buffer overflow kontrolü
            if (rx_count >= 64) {
              ESP_LOGW("RD03D", "Buffer overflow! Resetting...");
              rx_count = 0;
              memset(rx_buffer, 0, 64);
              error_count++;
              continue;
            }
            
            // Frame sonu kontrolü: 0x55 0xCC
            if (rx_count >= 2 && 
                rx_buffer[rx_count - 2] == 0x55 && 
                rx_buffer[rx_count - 1] == 0xCC) {
              
              frame_count++;
              
              // Frame uzunluğu kontrolü
              if (rx_count >= 30) {
                
                // Header kontrolü: 0xAA 0xFF 0x03 0x00
                if (rx_buffer[0] == 0xAA && 
                    rx_buffer[1] == 0xFF && 
                    rx_buffer[2] == 0x03 && 
                    rx_buffer[3] == 0x00) {
                  
                  // ✅ FIX: Frame geldi demektir, last_valid_data'yı HEMEN güncelle!
                  last_valid_data = millis();
                  
                  // Target1 verilerini parse et (byte 4-11)
                  int16_t target_x = ((int16_t)(rx_buffer[4] | (rx_buffer[5] << 8))) - 0x200;
                  int16_t target_y = ((int16_t)(rx_buffer[6] | (rx_buffer[7] << 8))) - 0x8000;
                  int16_t target_speed = ((int16_t)(rx_buffer[8] | (rx_buffer[9] << 8))) - 0x10;
                  uint16_t target_distance_res = rx_buffer[10] | (rx_buffer[11] << 8);
                  
                  // Mesafe hesapla
                  float distance = sqrt(pow(target_x, 2) + pow(target_y, 2)) / 10.0;
                  
                  // Açı hesapla
                  float angle = atan2(target_y, target_x) * 180.0 / 3.14159265359;
                  
                  // Hedef algılandı mı? (mesafe 0.5-900 cm arası)
                  bool target_detected = (distance > 0.5 && distance < 900);
                  
                  // Debug log (her 100 frame'de)
                  if (frame_count % 100 == 0) {
                    ESP_LOGD("RD03D", "Frame: %d, Distance: %.1f cm, Detected: %s", 
                             frame_count, distance, target_detected ? "YES" : "NO");
                  }
                  
                  // Sensörleri güncelle
                  if (target_detected) {
                    id(rd03d_distance).publish_state(distance);
                    id(rd03d_x).publish_state(target_x);
                    id(rd03d_y).publish_state(target_y);
                    id(rd03d_angle).publish_state(angle);
                    id(rd03d_speed).publish_state(target_speed);
                    id(rd03d_distance_res).publish_state(target_distance_res);
                    id(rd03d_target_detected).publish_state(true);
                    id(rd03d_status).publish_state("Target Detected");
                    
                  } else {
                    // ✅ FIX: Hedef yok ama sensörleri sıfırlamadan sadece durumu güncelle
                    id(rd03d_target_detected).publish_state(false);
                    id(rd03d_status).publish_state("No Target");
                    
                    // ✅ FIX: Sensörleri sıfırlama - önceki değerleri koru!
                    // Bu sayede son mesafe görünür kalır
                  }
                  
                } else {
                  ESP_LOGW("RD03D", "Invalid header");
                  error_count++;
                }
                
              } else {
                ESP_LOGW("RD03D", "Frame too short: %d bytes", rx_count);
                error_count++;
              }
              
              // Buffer'ı sıfırla
              rx_count = 0;
              memset(rx_buffer, 0, 64);
            }
          }
          
          // ✅ FIX: Timeout kontrolü - 10 saniyeye çıkardık (sensör bazen yavaş olabilir)
          if (millis() - last_valid_data > 10000 && last_valid_data > 0) {
            id(rd03d_target_detected).publish_state(false);
            id(rd03d_status).publish_state("No Data - Check Connections");
            ESP_LOGW("RD03D", "No data for 10 seconds! Frames: %d, Errors: %d", frame_count, error_count);
          }
          
          // İstatistik
          if (frame_count % 1000 == 0 && frame_count > 0) {
            ESP_LOGI("RD03D", "Stats - Frames: %d, Errors: %d (%.2f%%)", 
                     frame_count, error_count, (error_count * 100.0) / frame_count);
          }

button:
  - platform: restart
    name: "Restart ESP32"
    
  - platform: template
    name: "Reinitialize Sensor"
    on_press:
      - logger.log: "Reinitializing RD-03D sensor..."
      - uart.write:
          id: uart_rd03d
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0x80, 0x00, 0x04, 0x03, 0x02, 0x01]
      - delay: 200ms
      - logger.log: "RD-03D reinitialized"
