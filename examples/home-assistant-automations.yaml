## Distance-Based Control

### 2. Brightness by Distance

Adjust light brightness based on distance - brighter when closer.

```yaml
automation:
  - alias: "LED Brightness by Distance"
    description: "Closer = brighter"
    trigger:
      - platform: state
        entity_id: sensor.rd_03d_distance
    condition:
      - condition: state
        entity_id: binary_sensor.rd_03d_target_detected
        state: 'on'
    action:
      - service: light.turn_on
        target:
          entity_id: light.living_room
        data:
          brightness: >
            {% set distance = states('sensor.rd_03d_distance') | float(0) %}
            {% set max_distance = 800 %}  {# 8 meters #}
            {% set min_distance = 50 %}   {# 0.5 meters #}
            
            {# Calculate brightness: closer = brighter #}
            {% set normalized = (max_distance - distance) / (max_distance - min_distance) %}
            {% set brightness = (normalized * 255) | int %}
            
            {# Clamp between 10 and 255 #}
            {{ [10, [brightness, 255] | min] | max }}
```

### 3. Fan Speed by Distance

Control fan speed based on proximity.

```yaml
automation:
  - alias: "Fan Speed by Distance"
    description: "Closer = faster fan"
    trigger:
      - platform: state
        entity_id: sensor.rd_03d_distance
    condition:
      - condition: state
        entity_id: binary_sensor.rd_03d_target_detected
        state: 'on'
    action:
      - service: fan.set_percentage
        target:
          entity_id: fan.bedroom_fan
        data:
          percentage: >
            {% set distance = states('sensor.rd_03d_distance') | float(0) %}
            {% if distance < 200 %}
              100  {# Very close: full speed #}
            {% elif distance < 400 %}
              66   {# Medium: 2/3 speed #}
            {% elif distance < 600 %}
              33   {# Far: 1/3 speed #}
            {% else %}
              0    {# Very far: off #}
            {% endif %}
```

