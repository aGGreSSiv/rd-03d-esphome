## Multi-Zone Detection

### 8. Distance-Based Zones

Define zones by distance and trigger different actions.

```yaml
automation:
  - alias: "Zone 1 - Near (0-2m)"
    description: "Person very close"
    trigger:
      - platform: numeric_state
        entity_id: sensor.rd_03d_distance
        below: 200  # 2 meters in cm
    condition:
      - condition: state
        entity_id: binary_sensor.rd_03d_target_detected
        state: 'on'
    action:
      - service: light.turn_on
        target:
          entity_id: light.zone1
        data:
          rgb_color: [255, 0, 0]  # Red

  - alias: "Zone 2 - Medium (2-5m)"
    description: "Person at medium distance"
    trigger:
      - platform: numeric_state
        entity_id: sensor.rd_03d_distance
        above: 200
        below: 500
    condition:
      - condition: state
        entity_id: binary_sensor.rd_03d_target_detected
        state: 'on'
    action:
      - service: light.turn_on
        target:
          entity_id: light.zone2
        data:
          rgb_color: [255, 255, 0]  # Yellow

  - alias: "Zone 3 - Far (5-8m)"
    description: "Person far away"
    trigger:
      - platform: numeric_state
        entity_id: sensor.rd_03d_distance
        above: 500
    condition:
      - condition: state
        entity_id: binary_sensor.rd_03d_target_detected
        state: 'on'
    action:
      - service: light.turn_on
        target:
          entity_id: light.zone3
        data:
          rgb_color: [0, 255, 0]  # Green
```

