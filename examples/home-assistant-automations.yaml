## Energy Saving

### 9. Smart Thermostat Control

Adjust temperature based on occupancy.

```yaml
automation:
  - alias: "Occupied - Maintain Temperature"
    description: "Person present, keep comfortable temp"
    trigger:
      - platform: state
        entity_id: binary_sensor.rd_03d_target_detected
        to: 'on'
    action:
      - service: climate.set_temperature
        target:
          entity_id: climate.living_room
        data:
          temperature: 22  # Comfortable temperature

  - alias: "Vacant - Energy Saving"
    description: "No person for 5 min, reduce energy"
    trigger:
      - platform: state
        entity_id: binary_sensor.rd_03d_target_detected
        to: 'off'
        for:
          minutes: 5
    action:
      - service: climate.set_temperature
        target:
          entity_id: climate.living_room
        data:
          temperature: 18  # Energy saving temperature
```

### 10. Smart TV Power Management

Turn off TV when no one is in range.

```yaml
automation:
  - alias: "TV Auto-Off"
    description: "Turn off TV when room empty for 10 minutes"
    trigger:
      - platform: state
        entity_id: binary_sensor.rd_03d_target_detected
        to: 'off'
        for:
          minutes: 10
    condition:
      - condition: state
        entity_id: media_player.living_room_tv
        state: 'on'
    action:
      - service: media_player.turn_off
        target:
          entity_id: media_player.living_room_tv
      - service: notify.mobile_app
        data:
          title: "TV Auto-Off"
          message: "TV turned off - no activity detected"
```

