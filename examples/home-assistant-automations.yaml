## Tips and Best Practices

### Avoid False Triggers

```yaml
# Always add delays for "off" triggers
- platform: state
  to: 'off'
  for:
    seconds: 30  # Recommended minimum

# For lights, use longer delays
- platform: state
  to: 'off'
  for:
    minutes: 2  # Better for lights
```

### Use Conditions

```yaml
# Only trigger during certain times
condition:
  - condition: time
    after: '06:00:00'
    before: '23:00:00'

# Only when dark
condition:
  - condition: numeric_state
    entity_id: sensor.illuminance
    below: 50

# Only on weekdays
condition:
  - condition: time
    weekday:
      - mon
      - tue
      - wed
      - thu
      - fri
```

### Combine Multiple Triggers

```yaml
automation:
  - alias: "Smart Night Light"
    trigger:
      - platform: state
        entity_id: binary_sensor.rd_03d_target_detected
        to: 'on'
    condition:
      - condition: state
        entity_id: sun.sun
        state: 'below_horizon'
      - condition: numeric_state
        entity_id: sensor.rd_03d_speed
        below: 50  # Slow movement
    action:
      - service: light.turn_on
        target:
          entity_id: light.night_light
        data:
          brightness: 20
          kelvin: 2700
```

