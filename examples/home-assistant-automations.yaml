## Notification Examples

### 11. Presence Notifications

Get notified when someone enters/leaves.

```yaml
automation:
  - alias: "Notify Person Entered"
    description: "Send notification when person detected"
    trigger:
      - platform: state
        entity_id: binary_sensor.rd_03d_target_detected
        to: 'on'
    action:
      - service: notify.mobile_app
        data:
          title: "Person Detected"
          message: >
            Person entered room at {{ now().strftime('%H:%M:%S') }}
            Distance: {{ states('sensor.rd_03d_distance') }} cm
            Angle: {{ states('sensor.rd_03d_angle') }}°

  - alias: "Notify Person Left"
    description: "Send notification when person leaves"
    trigger:
      - platform: state
        entity_id: binary_sensor.rd_03d_target_detected
        to: 'off'
        for:
          seconds: 30
    action:
      - service: notify.mobile_app
        data:
          title: "Person Left"
          message: "No presence detected for 30 seconds"
```

