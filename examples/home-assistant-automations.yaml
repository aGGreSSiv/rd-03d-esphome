## Advanced Automations

### 6. Fade In/Out Effect

Smooth light transitions when entering/leaving.

```yaml
automation:
  - alias: "Light Fade In"
    description: "Gradually turn on light"
    trigger:
      - platform: state
        entity_id: binary_sensor.rd_03d_target_detected
        to: 'on'
    action:
      - service: light.turn_on
        target:
          entity_id: light.living_room
        data:
          brightness: 255
          transition: 2  # 2 second fade in

  - alias: "Light Fade Out"
    description: "Gradually turn off light"
    trigger:
      - platform: state
        entity_id: binary_sensor.rd_03d_target_detected
        to: 'off'
        for:
          seconds: 30
    action:
      - service: light.turn_on
        target:
          entity_id: light.living_room
        data:
          brightness: 0
          transition: 5  # 5 second fade out
      - delay:
          seconds: 5
      - service: light.turn_off
        target:
          entity_id: light.living_room
```

### 7. Speed-Based Detection

Trigger different actions based on movement speed.

```yaml
automation:
  - alias: "Fast Movement Alert"
    description: "Alert on running/fast movement"
    trigger:
      - platform: numeric_state
        entity_id: sensor.rd_03d_speed
        above: 100  # cm/s (about 3.6 km/h)
    action:
      - service: notify.mobile_app
        data:
          title: "Fast Movement Detected"
          message: "Someone is running in the room"

  - alias: "Slow Movement - Night Light"
    description: "Dim light for slow nighttime movement"
    trigger:
      - platform: numeric_state
        entity_id: sensor.rd_03d_speed
        below: 30  # cm/s (slow movement)
    condition:
      - condition: state
        entity_id: sun.sun
        state: 'below_horizon'
      - condition: state
        entity_id: binary_sensor.rd_03d_target_detected
        state: 'on'
    action:
      - service: light.turn_on
        target:
          entity_id: light.bedroom
        data:
          brightness: 25  # Very dim
          kelvin: 2700  # Warm color
```

