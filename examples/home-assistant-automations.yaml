## Angle-Based Control

### 4. RGB Color by Angle

Change LED color based on which side person is standing.

```yaml
automation:
  - alias: "RGB Color by Angle"
    description: "Left = blue, center = green, right = red"
    trigger:
      - platform: state
        entity_id: sensor.rd_03d_angle
    condition:
      - condition: state
        entity_id: binary_sensor.rd_03d_target_detected
        state: 'on'
    action:
      - service: light.turn_on
        target:
          entity_id: light.rgb_strip
        data:
          rgb_color: >
            {% set angle = states('sensor.rd_03d_angle') | float(0) %}
            {% if angle < -30 %}
              [0, 0, 255]      {# Left: Blue #}
            {% elif angle > 30 %}
              [255, 0, 0]      {# Right: Red #}
            {% else %}
              [0, 255, 0]      {# Center: Green #}
            {% endif %}
```

### 5. Curtain Control by Position

Open/close curtains based on which side person approaches from.

```yaml
automation:
  - alias: "Open Curtain Left"
    description: "Person approaching from left"
    trigger:
      - platform: numeric_state
        entity_id: sensor.rd_03d_angle
        below: -45
    condition:
      - condition: state
        entity_id: binary_sensor.rd_03d_target_detected
        state: 'on'
    action:
      - service: cover.open_cover
        target:
          entity_id: cover.left_curtain

  - alias: "Open Curtain Right"
    description: "Person approaching from right"
    trigger:
      - platform: numeric_state
        entity_id: sensor.rd_03d_angle
        above: 45
    condition:
      - condition: state
        entity_id: binary_sensor.rd_03d_target_detected
        state: 'on'
    action:
      - service: cover.open_cover
        target:
          entity_id: cover.right_curtain
```

