## Integration with Other Sensors

### Combine with Light Sensor

```yaml
automation:
  - alias: "Smart Auto-Light"
    description: "Only turn on if dark + person present"
    trigger:
      - platform: state
        entity_id: binary_sensor.rd_03d_target_detected
        to: 'on'
    condition:
      - condition: numeric_state
        entity_id: sensor.illuminance
        below: 50  # Only if dark
    action:
      - service: light.turn_on
        target:
          entity_id: light.living_room
```

### Combine with Door Sensor

```yaml
automation:
  - alias: "Security Alert"
    description: "Motion detected with door closed"
    trigger:
      - platform: state
        entity_id: binary_sensor.rd_03d_target_detected
        to: 'on'
    condition:
      - condition: state
        entity_id: binary_sensor.door
        state: 'off'  # Door closed
      - condition: state
        entity_id: alarm_control_panel.home
        state: 'armed_away'
    action:
      - service: notify.mobile_app
        data:
          title: "⚠️ Security Alert"
          message: "Motion detected while away!"
```

