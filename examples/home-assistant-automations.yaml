## Basic Automations

### 1. Simple Light Control

Turn light on when presence detected, off after 30 seconds of no motion.

```yaml
automation:
  - alias: "Light ON - Motion Detected"
    description: "Turn on light when person enters room"
    trigger:
      - platform: state
        entity_id: binary_sensor.rd_03d_target_detected
        to: 'on'
    action:
      - service: light.turn_on
        target:
          entity_id: light.living_room

  - alias: "Light OFF - No Motion"
    description: "Turn off light after 30s of no motion"
    trigger:
      - platform: state
        entity_id: binary_sensor.rd_03d_target_detected
        to: 'off'
        for:
          seconds: 30  # Wait 30 seconds before turning off
    action:
      - service: light.turn_off
        target:
          entity_id: light.living_room
```

