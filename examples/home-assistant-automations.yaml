## Debugging Automations

### Add Logging

```yaml
action:
  - service: system_log.write
    data:
      message: >
        Automation triggered: 
        Distance={{ states('sensor.rd_03d_distance') }}
        Angle={{ states('sensor.rd_03d_angle') }}
      level: info
  - service: light.turn_on  # Your actual action
    ...
```

### Test Mode

```yaml
# Set automation to manual mode first
mode: single  # or restart, queued, parallel

# Add a notification to test
action:
  - service: notify.mobile_app
    data:
      title: "Test"
      message: "Automation triggered!"
  # Then add your real actions
```

